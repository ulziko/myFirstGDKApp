[package]
name = "portfolio-api"
description = "Rust Vercel serverless functions for the portfolio (health, portfolio, contact)."

[[bin]]
name = "health"
path = "health.rs"

[[bin]]
name = "portfolio"
path = "portfolio.rs"

[[bin]]
name = "contact"
path = "contact.rs"

[lib]
path = "src/lib.rs"

[dependencies]
vercel_runtime = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portfolio-shared = { path = "../crates/shared" }
tokio = { version = "1", features = ["macros"] }
hyper = "1"
reqwest = { version = "0.12", features = ["json"] }
